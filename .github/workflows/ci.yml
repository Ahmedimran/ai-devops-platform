name: AI DevOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # -------------------------
  # CI
  # -------------------------
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

      - name: Build Docker image
        run: |
          docker build -t ai-devops-api:${{ github.sha }} .

  # -------------------------
  # CD
  # -------------------------
  deploy:
    needs: test-and-build
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker
        run: |
          docker --version

      - name: Check Kubernetes
        run: |
          kubectl version --client
          kubectl get nodes

      - name: Check Minikube
        run: |
          minikube status

      - name: Build Docker image
        run: |
          docker build -t ai-devops-api:latest .

      - name: Load image into Minikube
        run: |
          minikube image load ai-devops-api:latest

      - name: Deploy Config
        run: |
          kubectl apply -f k8s/config/

      - name: Deploy PostgreSQL
        run: |
          kubectl apply -f k8s/postgres/

      - name: Deploy API
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for API rollout
        run: |
          kubectl rollout status deployment/ai-api --timeout=120s

      - name: Show deployment
        run: |
          kubectl get pods
          kubectl get services
          kubectl get ingress